name: Track wallet

on:
  # Twice a day: 07:00 & 19:00 UTC = midnight & noon Pacific.
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "poll (current) / backfill (full history, Premium) / migrate (re-obscure existing points)"
        required: true
        default: "poll"
        type: choice
        options:
          - poll
          - backfill
          - migrate

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch wallet location
        env:
          TILE_EMAIL: ${{ secrets.TILE_EMAIL }}
          TILE_PASSWORD: ${{ secrets.TILE_PASSWORD }}
          TILE_NAME: ${{ vars.TILE_NAME }}
          MODE: ${{ github.event.inputs.mode || 'poll' }}
        run: python fetch_wallet.py

      - name: Commit updated data
        run: |
          git config user.name "wallet-bot"
          git config user.email "wallet-bot@users.noreply.github.com"
          git add wallet.json .geocache.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new location - nothing to commit."
          else
            git commit -m "Update wallet trail ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
